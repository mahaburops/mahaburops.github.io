<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Mahabur Hossain</title>

<!-- Favicon -->
<link rel="icon" href="favicon_icon.png">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
:root {
    color-scheme: dark;
    --page: #080d1a;
    --panel: rgba(17, 25, 46, 0.88);
    --panel-border: rgba(255, 255, 255, 0.10);
    --text: #f4f7ff;
    --muted: #aab5cc;
    --accent: #78f0d1;
    --accent-2: #8ca7ff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    padding: 32px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    background:
        radial-gradient(ellipse at 12% 8%, rgba(76, 110, 245, 0.20), transparent 34%),
        radial-gradient(ellipse at 90% 88%, rgba(55, 224, 184, 0.13), transparent 32%),
        var(--page);
    overflow-x: hidden;
}

/* Main layout */
.container {
    width: 100%;
    max-width: 460px;
    margin: auto;
    padding: 8px;
}

/* Profile card */
.card {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    padding: 38px 28px 24px;
    text-align: center;
    border: 1px solid var(--panel-border);
    border-radius: 30px;
    background: linear-gradient(145deg, rgba(25, 36, 63, 0.96), var(--panel));
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255,255,255,0.05);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    animation: cardIn .7s cubic-bezier(.2,.75,.25,1) both;
}

.card::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: -105px;
    left: 50%;
    width: 240px;
    height: 190px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: rgba(120, 240, 209, 0.13);
    filter: blur(48px);
    pointer-events: none;
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Profile photo */
.profile {
    display: flex;
    justify-content: center;
    margin-bottom: 19px;
}

.profile img {
    display: block;
    width: 108px;
    height: 108px;
    object-fit: cover;
    border-radius: 50%;
    padding: 4px;
    border: 1px solid rgba(120, 240, 209, 0.85);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 0 7px rgba(120, 240, 209, 0.07), 0 12px 35px rgba(0,0,0,.3);
}

h1 {
    margin-bottom: 9px;
    font-size: clamp(1.55rem, 5vw, 1.9rem);
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.7px;
    color: var(--text);
}

p {
    max-width: 300px;
    margin: 0 auto 27px;
    color: var(--muted);
    font-size: .88rem;
    line-height: 1.7;
}

/* Social and contact links */
.links {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.links a {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 58px;
    padding: 14px 17px;
    overflow: hidden;
    text-align: left;
    text-decoration: none;
    color: var(--text);
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.085);
    border-radius: 16px;
    transition: transform .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease;
}

.links a::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0;
    background: linear-gradient(105deg, rgba(120,240,209,.13), rgba(140,167,255,.10));
    transition: opacity .22s ease;
    pointer-events: none;
}

.links a:hover {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.075);
    border-color: rgba(120, 240, 209, 0.38);
    box-shadow: 0 8px 22px rgba(0,0,0,.16);
}

.links a:hover::before,
.links a:focus-visible::before {
    opacity: 1;
}

.links a:active {
    transform: translateY(0) scale(.99);
}

.links a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
}

.links a img {
    position: relative;
    z-index: 1;
    display: block;
    flex: 0 0 28px;
    width: 28px;
    height: 28px;
    object-fit: contain;
    border-radius: 7px;
}

.links a span {
    position: relative;
    z-index: 1;
    font-size: .93rem;
    font-weight: 500;
    letter-spacing: .1px;
}

footer {
    margin-top: 24px;
    padding-top: 18px;
    color: #7f8ba5;
    font-size: .76rem;
    letter-spacing: .3px;
    border-top: 1px solid rgba(255,255,255,.08);
}

@media (max-width: 480px) {
    body { padding: 20px 12px; }
    .container { padding: 4px; }
    .card { padding: 30px 19px 20px; border-radius: 25px; }
    .profile img { width: 100px; height: 100px; }
    .links { gap: 9px; }
    .links a { min-height: 55px; padding: 12px 14px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<script>
document.querySelectorAll('.email-link').forEach(function(link) {

    link.addEventListener('click', function(event) {

        const email = this.getAttribute('data-email');

        // Detect mobile/tablet
        const isMobile = /Android|iPhone|iPad|iPod|Windows Phone/i.test(
            navigator.userAgent
        );

        if (!isMobile) {
            // Desktop → Gmail Compose
            event.preventDefault();

            const gmailUrl =
                'https://mail.google.com/mail/?view=cm&fs=1&to=' +
                encodeURIComponent(email);

            window.open(gmailUrl, '_blank');
        }

        // Mobile:
        // Do nothing → normal mailto: opens
    });

});
</script>
