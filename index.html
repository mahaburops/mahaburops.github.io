<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

/* Container */
.container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

/* Card */
.card {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 25px;
    backdrop-filter: blur(20px);
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 0 40px rgba(0,255,255,0.1);
    animation: fadeIn 1s ease;
}

/* Animation */
@keyframes fadeIn {
    from {opacity:0; transform: translateY(30px);}
    to {opacity:1; transform: translateY(0);}
}

/* Profile */
.profile img {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    border: 3px solid #00ffff;
    margin-bottom: 15px;
}

/* Name */
h1 {
    font-size: 1.8rem;
    color: #00ffff;
}

p {
    font-size: 0.95rem;
    color: #ccc;
    margin-bottom: 25px;
}

/* Links */
.links {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.links a {
    text-decoration: none;
    color: white;
    padding: 13px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.08);
    transition: 0.3s;
    position: relative;
    overflow: hidden;
}

/* Icons */
.links a img {
    width: 26px;
    height: 26px;
}

/* Glow hover */
.links a::before {
    content: "";
    position: absolute;
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #00ffff, #00c3ff);
    top: 0;
    left: 0;
    transition: 0.4s;
}

.links a:hover::before {
    width: 100%;
}

.links a span {
    position: relative;
    z-index: 1;
}

.links a img {
    position: relative;
    z-index: 1;
}

.links a:hover {
    transform: scale(1.05);
}

/* Footer */
footer {
    margin-top: 20px;
    font-size: 0.8rem;
    color: #aaa;
}

/* Responsive */
@media(max-width:480px){
    h1 {font-size:1.5rem;}
}
</style>
